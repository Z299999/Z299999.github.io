<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDAFF 2026 · 选片与日程</title>
<!-- Unlisted, not private: reachable by anyone with the link. Kept out of the
     nav, the footer and sitemap.xml, and asks search engines to stay away. -->
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="SDAFF 2026 个人选片页：候选长片、短片合集与电影节特别活动。非官方页面。">
<style>
:root {
  --bg: #101722; --paper: #182230; --raise: #212d3c; --line: #344252;
  --ink: #f3f2ec; --muted: #aebac6; --accent: #d9b886; --warn: #f0a68f;
  --ok: #8fc7a4; --chip: #2a3846;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  word-break: normal; overflow-wrap: anywhere;
}
a { color: var(--accent); }
header { background: #1d2836; padding: 32px 16px 22px; }
.wrap { max-width: 1080px; margin: 0 auto; }
main.wrap { padding: 0 16px 48px; }
h1 { font-size: clamp(24px, 5vw, 38px); margin: 0 0 6px; line-height: 1.25; }
h2 { font-size: 20px; margin: 30px 0 12px; }
.sub { color: var(--muted); margin: 6px 0; font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.facts span { background: var(--chip); padding: 6px 11px; border-radius: 999px; font-size: 13px; }
.notice { background: #262230; border-left: 3px solid var(--accent); padding: 10px 14px; margin: 16px 0 0; font-size: 13px; color: #ded6c8; border-radius: 6px; }

nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tabs button, .chip, .btn {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
.chip[aria-pressed="true"] { background: #3a4f63; border-color: var(--accent); }
.btn { border-radius: 8px; }
.btn.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; align-items: center; }
select, input[type=search] {
  font: inherit; font-size: 14px; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%;
}
.hidden { display: none !important; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 16px; }
.card { display: grid; grid-template-columns: 140px minmax(0, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.visual { position: relative; background: linear-gradient(135deg, #2f4254, #18222e); min-height: 200px; }
.visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.visual .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 12px; color: #cdd6e0; }
.body { padding: 14px 16px; }
.body h3 { margin: 0 0 2px; font-size: 17px; line-height: 1.35; }
.kind { font-size: 12px; color: var(--accent); letter-spacing: .04em; }
.meta { font-size: 13px; color: var(--muted); }
.body p { margin: 8px 0; font-size: 14px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: #33404e; margin: 2px 4px 2px 0; }
.tag.qa { background: #3d3a2a; color: #f1dca8; }
.tag.rec { background: #2f3a4a; color: #bcd4f2; }
.tag.free { background: #24382e; color: var(--ok); }
.tag.limit { background: #44282a; color: #f3b8a9; }
.shows { list-style: none; padding: 0; margin: 10px 0 6px; }
.shows li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.shows li .when { font-variant-numeric: tabular-nums; min-width: 9.5em; }
.shows select { padding: 4px 8px; font-size: 13px; }
.st-想看 { border-color: #6c8bb0 !important; }
.st-约了人 { border-color: #b59ad1 !important; }
.st-已买票 { border-color: var(--ok) !important; background: #1e3328 !important; }
.links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; margin-top: 6px; }
.shorts { margin-top: 8px; font-size: 13px; }
.shorts summary { cursor: pointer; color: var(--accent); }
.shorts ul { margin: 6px 0 0; padding-left: 18px; }
.conflict { color: var(--warn); font-size: 13px; }

/* timeline */
.day { margin: 26px 0 0; }
.day h3 { font-size: 17px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid #222d3a; }
.item .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.item .t b { color: var(--ink); font-weight: 600; display: block; font-size: 15px; }
.item .what { min-width: 0; }
.item .what a.title { font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid #556578; }
.item .cat { font-size: 12px; color: var(--accent); margin-right: 6px; }
.item.film .what a.title { color: #fff; }
.item.limited { opacity: .72; }
.item .det { font-size: 13px; color: var(--muted); margin-top: 2px; }
.item .sub-qa { font-size: 13px; color: #f1dca8; margin-top: 3px; }
.item select { margin-top: 6px; padding: 3px 8px; font-size: 13px; }
.empty { color: var(--muted); padding: 20px 0; }

/* my plan */
.plan { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.plan ol { padding-left: 20px; margin: 8px 0; }
.plan li { margin: 4px 0; }
.warning { background: #332930; border-left: 3px solid var(--warn); padding: 9px 13px; margin: 8px 0; border-radius: 6px; font-size: 14px; }
.banner { background: #22303d; border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 16px 0 0; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--accent); color: #1a1a1a; padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
footer { color: var(--muted); font-size: 13px; padding: 30px 0 10px; border-top: 1px solid var(--line); margin-top: 36px; }
footer ul { padding-left: 18px; }

@media (max-width: 520px) {
  .card { grid-template-columns: 1fr; }
  .visual { min-height: 0; aspect-ratio: 16 / 9; }
  .item { grid-template-columns: 5.4em minmax(0, 1fr); }
  .shows li .when { min-width: 0; }
}
@media print {
  body { background: #fff; color: #000; }
  nav.tabs, .toolbar, select, .btn { display: none !important; }
  .card, .plan { background: #fff; break-inside: avoid; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>SDAFF 2026 · 选片与日程</h1>
    <p class="sub">第 27 届圣地亚哥亚洲电影节（2026 San Diego Asian Film Festival）· 11/05（周四）至 11/14（周六）</p>
    <div class="facts" id="facts"></div>
    <p class="notice">这是一页个人整理、通过链接分享的选片表，<b>不是电影节官方页面</b>。场次、票价与活动以
      <a href="https://sdaff.org/2026/schedule/" target="_blank" rel="noopener noreferrer">SDAFF 官方排片</a>为准。
      页面上的标记只存在你自己的浏览器里，别人看不到；所有影片都只是候选，没有任何一场已经买票。</p>
    <div id="shared" class="banner hidden"></div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-cards" aria-selected="true">电影卡片</button>
    <button role="tab" id="tab-timeline" aria-selected="false">全部时间线</button>
    <button role="tab" id="tab-plan" aria-selected="false">我的安排 <span id="plan-count"></span></button>
  </nav>

  <section id="view-cards">
    <div class="toolbar">
      <select id="c-kind" aria-label="类型">
        <option value="all">全部节目</option>
        <option value="feature">只看长片</option>
        <option value="shorts">只看短片合集</option>
      </select>
      <select id="c-date" aria-label="日期"><option value="all">全部日期</option></select>
      <input type="search" id="c-q" placeholder="搜索片名 / 剧情 / 短片" aria-label="搜索">
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="view-timeline" class="hidden">
    <div class="toolbar">
      <select id="t-date" aria-label="日期"><option value="all">全部日期</option></select>
    </div>
    <div class="toolbar" id="t-cats" aria-label="分类"></div>
    <div class="toolbar" id="t-flags" aria-label="筛选"></div>
    <div id="timeline"></div>
  </section>

  <section id="view-plan" class="hidden">
    <div class="plan" id="plan"></div>
  </section>

  <footer>
    <ul id="notes"></ul>
    <p>来源：<a href="https://sdaff.org/2026/schedule/" target="_blank" rel="noopener noreferrer">SDAFF 2026 Schedule</a> ·
      <a href="https://sdaff.org/2026/special-events/" target="_blank" rel="noopener noreferrer">SDAFF 2026 Special Events</a>。
      剧照来自 SDAFF 官方影片页，版权归各片方所有。</p>
  </footer>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const STATUSES = ["候选", "想看", "约了人", "已买票"];
const ACTIVE = new Set(["想看", "约了人", "已买票"]);
const KEY = "sdaff2026:marks:v1";
const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const CAT = {
  feature: "电影", shorts: "短片", reception: "社交", social: "社交",
  awards: "颁奖", artist_talk: "讲座", special_screening: "特别场",
  industry_only: "限定", students: "限定"
};
const CATS = ["电影", "短片", "社交", "讲座", "颁奖", "特别场", "限定"];
const LIMIT_NOTE = { industry_only: "仅限受邀电影人与业内嘉宾", students: "合作学校学生项目" };

let D, T = {}, marks = {};
const $ = s => document.querySelector(s);
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
const wd = date => WEEK[new Date(date + "T12:00:00Z").getUTCDay()];
const day = date => `${date.slice(5, 7)}/${date.slice(8)}（${wd(date)}）`;
const mins = hm => +hm.slice(0, 2) * 60 + +hm.slice(3);
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const slotEnd = s => hm(mins(s.start) + s.slotMinutes);
const status = id => marks[id] || "候选";
const isFree = x => /免费/.test(x.price || "") || /免费/.test(x.eligibility || "");

function load() {
  try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { marks = {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) { /* private mode: marks last this visit only */ }
}
function setMark(id, v) {
  if (v === "候选") delete marks[id]; else marks[id] = v;
  save(); renderAll();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1800);
}

function statusSelect(sid) {
  const st = status(sid);
  return `<select data-sid="${esc(sid)}" class="st-${esc(st)}" aria-label="这一场的状态">` +
    STATUSES.map(s => `<option${s === st ? " selected" : ""}>${s}</option>`).join("") + "</select>";
}

/* Overlaps among the screenings you marked. Uses the schedule slot (REEL
   VOICES: 120 min, not its 94 min of shorts); Q&A and receptions have no
   published end, so they never count. */
function conflicts() {
  const a = D.screenings.filter(s => ACTIVE.has(status(s.id)));
  const out = [];
  for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
    const x = a[i], y = a[j];
    if (x.date === y.date && mins(x.start) < mins(y.start) + y.slotMinutes && mins(y.start) < mins(x.start) + x.slotMinutes) out.push([x, y]);
  }
  return out;
}
function conflictIds() {
  const ids = new Set();
  for (const [x, y] of conflicts()) { ids.add(x.id); ids.add(y.id); }
  return ids;
}

function durationText(t, s) {
  if (s && s.slotMinutes !== t.minutes)
    return `片长合计 ${t.minutes} 分钟；官方排片时段 ${s.slotMinutes} 分钟（冲突按 ${s.slotMinutes} 分钟算）`;
  return `${t.minutes} 分钟`;
}

function renderFacts() {
  const f = D.titles.filter(t => t.type === "feature").length;
  const p = D.titles.filter(t => t.type === "shorts").length;
  const h = D.titles.reduce((n, t) => n + (t.highlightedShorts || []).length, 0);
  $("#facts").innerHTML = [`${f} 部候选长片`, `${p} 个短片合集`, `${h} 部重点短片`, `${D.screenings.length} 个场次`, `${D.events.length} 项特别活动`]
    .map(x => `<span>${x}</span>`).join("");
}

function renderCards() {
  const kind = $("#c-kind").value, date = $("#c-date").value, q = $("#c-q").value.trim().toLowerCase();
  const bad = conflictIds();
  const list = D.titles.filter(t => {
    const shows = D.screenings.filter(s => s.title === t.id);
    if (kind !== "all" && t.type !== kind) return false;
    if (date !== "all" && !shows.some(s => s.date === date)) return false;
    if (q) {
      const hay = [t.name, t.tagline, t.description, ...(t.highlightedShorts || [])].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  $("#cards").innerHTML = list.map(t => {
    const shows = D.screenings.filter(s => s.title === t.id);
    const img = t.image
      ? `<div class="ph">官方图片未能加载<br>请打开官方页面查看</div><img src="${esc(t.image)}" alt="${esc(t.name)} 官方剧照" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
      : `<div class="ph">暂无可靠的官方图片<br>请打开官方页面查看</div>`;
    const showRows = shows.map(s => {
      const tags = (s.qa ? `<span class="tag qa">映后 Q&amp;A · 结束时间未公布</span>` : "") +
        (s.reception ? `<span class="tag rec">Reception ${esc(s.reception)}</span>` : "") +
        (isFree(s) ? `<span class="tag free">免费</span>` : "");
      return `<li><span class="when">${day(s.date)} <b>${esc(s.start)}</b></span>${statusSelect(s.id)}${tags}` +
        (bad.has(s.id) ? `<span class="conflict">⚠ 与另一场标记重叠</span>` : "") + `</li>`;
    }).join("");
    const shorts = t.type === "shorts"
      ? `<details class="shorts"><summary>重点短片 ${(t.highlightedShorts || []).length} 部（合集内作品，不单独售票）</summary>` +
        ((t.highlightedShorts || []).length ? `<ul>${t.highlightedShorts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="meta">这个合集整体候选，没有单独标记的短片。</p>`) +
        `</details>` : "";
    return `<article class="card"><div class="visual">${img}</div><div class="body">
      <div class="kind">${t.type === "feature" ? "长片" : "短片合集"}</div>
      <h3>${esc(t.name)}</h3>
      <div class="meta">${esc(durationText(t, shows.find(s => s.slotMinutes !== t.minutes)))} · ${esc(t.price)} · ${esc(shows[0].venue)}</div>
      <p>${esc(t.description || t.tagline)}</p>
      <ul class="shows">${showRows}</ul>
      ${shorts}
      <div class="links">${ext(t.url, "官方详情 / 购票 ↗")}${t.imageFrom ? `<span class="meta">图片来自合集内《${esc(t.imageFrom)}》</span>` : ""}</div>
    </div></article>`;
  }).join("") || `<p class="empty">没有符合条件的节目。</p>`;
}

const tState = { cats: new Set(), free: false, qa: false, rec: false };
function timelineItems() {
  const items = D.screenings.map(s => {
    const t = T[s.title];
    return { kind: "screening", date: s.date, start: s.start, cat: CAT[t.type], s, t,
      free: isFree(s), qa: s.qa, rec: !!s.reception };
  }).concat(D.events.map(e => ({ kind: "event", date: e.date, start: e.start, cat: CAT[e.type] || "社交", e,
    free: isFree(e), qa: false, rec: e.type === "reception" })));
  return items.sort((a, b) => a.date.localeCompare(b.date) || (a.start ? mins(a.start) : -1) - (b.start ? mins(b.start) : -1));
}
function renderTimeline() {
  const date = $("#t-date").value, bad = conflictIds();
  const items = timelineItems().filter(i =>
    (date === "all" || i.date === date) &&
    (!tState.cats.size || tState.cats.has(i.cat)) &&
    (!tState.free || i.free) && (!tState.qa || i.qa) && (!tState.rec || i.rec));
  const days = {};
  for (const i of items) (days[i.date] ||= []).push(i);
  $("#timeline").innerHTML = Object.entries(days).map(([d, list]) => `<div class="day"><h3>${day(d)}</h3>` +
    list.map(i => {
      if (i.kind === "screening") {
        const { s, t } = i;
        return `<div class="item film"><div class="t"><b>${esc(s.start)}</b>约至 ${slotEnd(s)}</div><div class="what">
          <span class="cat">${i.cat}</span>${ext(t.url, esc(t.name)).replace("<a ", '<a class="title" ')}
          ${i.free ? `<span class="tag free">免费</span>` : ""}
          <div class="det">${esc(durationText(t, s))} · ${esc(s.price)} · ${esc(s.venue)}</div>
          ${s.qa ? `<div class="sub-qa">↳ 映后 Q&amp;A（官方未公布结束时间）</div>` : ""}
          ${statusSelect(s.id)}${bad.has(s.id) ? ` <span class="conflict">⚠ 与另一场标记重叠</span>` : ""}
        </div></div>`;
      }
      const e = i.e, limited = e.access === "restricted";
      const time = e.start ? `<b>${esc(e.start)}</b>${e.end ? "至 " + esc(e.end) : "结束时间未公布"}` : `<b>待定</b>官网未列时刻`;
      return `<div class="item${limited ? " limited" : ""}"><div class="t">${time}</div><div class="what">
        <span class="cat">${esc(i.cat)}</span>${ext(e.officialUrl, esc(e.title)).replace("<a ", '<a class="title" ')}
        ${limited ? `<span class="tag limit">${esc(LIMIT_NOTE[e.type] || "有参加限制")}</span>` : ""}
        ${i.free ? `<span class="tag free">免费</span>` : ""}
        <div class="det">${esc(e.description)}</div>
        <div class="det">参加条件：${esc(e.eligibility)} · ${esc(e.venue)}</div>
      </div></div>`;
    }).join("") + `</div>`).join("") || `<p class="empty">没有符合条件的场次或活动。</p>`;
}

function planText() {
  const mine = D.screenings.filter(s => ACTIVE.has(status(s.id)))
    .sort((a, b) => a.date.localeCompare(b.date) || mins(a.start) - mins(b.start));
  return mine.map(s => `${day(s.date)} ${s.start}–${slotEnd(s)}  ${T[s.title].name}  [${status(s.id)}]${s.qa ? "  (映后 Q&A)" : ""}  ${s.venue}`);
}
function shareHash() {
  return "#p=" + Object.entries(marks).map(([id, st]) => id + "." + STATUSES.indexOf(st)).join(",");
}
function renderPlan() {
  const lines = planText(), pairs = conflicts();
  $("#plan-count").textContent = lines.length ? `(${lines.length})` : "";
  $("#plan").innerHTML = lines.length
    ? `<p class="sub">你标记为「想看 / 约了人 / 已买票」的场次，按时间排列（结束时间为估算）。</p>
       <ol>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ol>
       ${pairs.map(([x, y]) => `<div class="warning">${day(x.date)}：${esc(T[x.title].name)} ${x.start}–${slotEnd(x)} 与 ${esc(T[y.title].name)} ${y.start}–${slotEnd(y)} 时间重叠</div>`).join("")}
       <div class="toolbar"><button class="btn primary" id="copy-text">复制我的安排（文字）</button>
       <button class="btn" id="copy-link">复制分享链接</button><button class="btn" id="clear">清空我的标记</button></div>
       <p class="sub">分享链接只带上你的标记；朋友打开后可以选择是否载入，不会改动你这边的任何东西。</p>`
    : `<p class="sub">还没有标记。在「电影卡片」或「全部时间线」里把某一场改成「想看 / 约了人 / 已买票」，这里会列出你的安排并检查时间冲突。</p>`;
  if (!lines.length) return;
  $("#copy-text").onclick = () => copy(`SDAFF 2026 · 我的安排\n${lines.join("\n")}\n（以官网为准：${D.officialSchedule}）`, "已复制文字");
  $("#copy-link").onclick = () => copy(location.origin + location.pathname + shareHash(), "已复制链接");
  $("#clear").onclick = () => { if (confirm("清空这个浏览器里的所有标记？")) { marks = {}; save(); renderAll(); } };
}
function copy(text, ok) {
  const done = () => toast(ok);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { prompt("复制下面的内容：", text); }
    ta.remove();
  }
}

function readShared() {
  const m = location.hash.match(/^#p=([\w.,]*)$/);
  if (!m) return;
  const got = {};
  for (const part of m[1].split(",")) {
    const [id, n] = part.split(".");
    if (D.screenings.some(s => s.id === id) && STATUSES[+n] && +n > 0) got[id] = STATUSES[+n];
  }
  const ids = Object.keys(got);
  if (!ids.length) return;
  const box = $("#shared");
  box.innerHTML = `<b>朋友分享的选择（${ids.length} 场）</b><ol>` +
    D.screenings.filter(s => got[s.id]).map(s => `<li>${day(s.date)} ${s.start} ${esc(T[s.title].name)} [${got[s.id]}]</li>`).join("") +
    `</ol><div class="toolbar"><button class="btn primary" id="sh-merge">载入到我的标记</button><button class="btn" id="sh-close">只看看，不载入</button></div>`;
  box.classList.remove("hidden");
  const close = () => { box.classList.add("hidden"); history.replaceState(null, "", location.pathname); };
  $("#sh-merge").onclick = () => { Object.assign(marks, got); save(); close(); renderAll(); toast("已载入"); };
  $("#sh-close").onclick = close;
}

function renderAll() {
  renderCards(); renderTimeline(); renderPlan();
  document.querySelectorAll("select[data-sid]").forEach(el => el.onchange = () => setMark(el.dataset.sid, el.value));
}

function setupControls() {
  const dates = [...new Set(D.screenings.map(s => s.date).concat(D.events.map(e => e.date)))].sort();
  for (const sel of ["#c-date", "#t-date"]) for (const d of dates) {
    const o = document.createElement("option"); o.value = d; o.textContent = day(d); $(sel).appendChild(o);
  }
  $("#t-cats").innerHTML = CATS.map(c => `<button class="chip" aria-pressed="false" data-cat="${c}">${c}</button>`).join("");
  $("#t-flags").innerHTML = [["free", "免费"], ["qa", "有 Q&A"], ["rec", "Reception"]]
    .map(([k, l]) => `<button class="chip" aria-pressed="false" data-flag="${k}">${l}</button>`).join("");
  $("#t-cats").onclick = ev => {
    const b = ev.target.closest("[data-cat]"); if (!b) return;
    const c = b.dataset.cat, on = !tState.cats.has(c);
    on ? tState.cats.add(c) : tState.cats.delete(c); b.setAttribute("aria-pressed", on); renderAll();
  };
  $("#t-flags").onclick = ev => {
    const b = ev.target.closest("[data-flag]"); if (!b) return;
    const k = b.dataset.flag; tState[k] = !tState[k]; b.setAttribute("aria-pressed", tState[k]); renderAll();
  };
  ["#c-kind", "#c-date", "#c-q", "#t-date"].forEach(s => $(s).addEventListener("input", renderAll));
  const views = ["cards", "timeline", "plan"];
  const show = v => {
    views.forEach(x => {
      $("#view-" + x).classList.toggle("hidden", x !== v);
      $("#tab-" + x).setAttribute("aria-selected", x === v);
    });
    try { localStorage.setItem("sdaff2026:view", v); } catch (e) {}
  };
  views.forEach(v => $("#tab-" + v).onclick = () => show(v));
  let v0 = "cards"; try { v0 = localStorage.getItem("sdaff2026:view") || "cards"; } catch (e) {}
  show(views.includes(v0) ? v0 : "cards");
  $("#notes").innerHTML = [
    "同一部影片的不同日期是不同场次，每一场分别标记。",
    "结束时间按片长估算；映后 Q&A 与 Reception 的结束时间官方多未公布，不参与冲突计算。",
    "REEL VOICES：合集页写 94 分钟短片，官方排片给 120 分钟时段；冲突按 120 分钟算。",
    "Happy Hour 需要 SDAFF 门票或 All-Fest Pass；各场 Reception 需要对应场次的票或 All-Fest Pass；Filmmaker Brunch 仅限业内，Youth Days 是合作学校项目，普通观众不能自行参加。",
    "官方剧照来自 SDAFF 的图片服务器，可能加载失败；失败时请点「官方详情」查看。"
  ].concat(D.verified ? [`${day(D.verified.date)}已对照官网核对：全部场次的日期、开场时间、影院、片长与活动时间一致；Youth Days 的时间和地点官方未公布。`] : [])
    .map(x => `<li>${esc(x)}</li>`).join("");
}

fetch("data.json").then(r => r.json()).then(data => {
  D = data;
  for (const t of D.titles) T[t.id] = t;
  load(); renderFacts(); setupControls(); readShared(); renderAll();
}).catch(() => {
  $("#cards").innerHTML = `<p class="empty">数据没有加载出来，请刷新，或直接看 ${ext("https://sdaff.org/2026/schedule/", "官方排片")}。</p>`;
});
</script>
</body>
</html>
